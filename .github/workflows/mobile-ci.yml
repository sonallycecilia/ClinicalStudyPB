name: Mobile CI

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Run tests
        working-directory: mobile
        run: npm test -- --runInBand

      - name: Run lint
        working-directory: mobile
        run: npm run lint

      - name: Check types
        working-directory: mobile
        run: npm run typecheck

      - name: Export Expo bundles
        working-directory: mobile
        run: npx expo export --platform all --output-dir "$RUNNER_TEMP/mobile-export"
